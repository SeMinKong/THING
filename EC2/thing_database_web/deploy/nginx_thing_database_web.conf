# /etc/nginx/sites-available/thing_database_web
# 설치: sudo cp nginx_thing_database_web.conf /etc/nginx/sites-available/thing_database_web
#       sudo ln -s /etc/nginx/sites-available/thing_database_web /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# frontend_dist 경로는 "npm run build"로 생성된 frontend/dist 폴더를 가리켜야 합니다.

server {
    listen 80;
    server_name i15c103.p.ssafy.io;

    # Vue 빌드 결과물 (frontend/dist)
    root /home/ubuntu/nerf_updated/thing_database_web/frontend/dist;
    index index.html;

    # 1) API 요청 -> gunicorn(127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2) Django admin
    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3) 업로드된 모터 로그 파일(media/) - 로컬 media 스텁 서빙
    location /media/ {
        alias /home/ubuntu/nerf_updated/thing_database_web/backend/media/;
    }

    # 4) 나머지는 Vue SPA (vue-router history 모드 대응)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
