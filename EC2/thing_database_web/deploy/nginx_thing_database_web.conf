# /etc/nginx/sites-available/thing_database_web
#
# 설치: sudo cp nginx_thing_database_web.conf /etc/nginx/sites-available/thing_database_web
#       sudo ln -sfn /etc/nginx/sites-available/thing_database_web /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# 반영 전 확인 (443 이 살아 있는지):
#       grep -E "^\s*listen|^\s*ssl_certificate" nginx_thing_database_web.conf
#
# -----------------------------------------------------------------------------
# 배포 경로
#
#   PROJECT_ROOT = /home/ubuntu/ec2_server/thing_database_web
#
# 실제 체크아웃 경로가 다르면 아래 root / alias 를 함께 고친다.
#
# -----------------------------------------------------------------------------
# HTTPS 전용
#
# 포트 80 은 열지 않는다 (명세서 FR-52 "공개 인바운드 443만").
# SSAFY 가 제공하는 와일드카드 인증서 *.p.ssafy.io 를 사용하며 DNS-01 로 발급된
# 것이라 ACME 갱신에 80 이 필요하지 않다.
#
# certbot 의 --nginx 플러그인은 쓰지 않는다. 배포 절차가 이 파일을
# /etc/nginx/sites-available/ 로 sudo cp 하므로, certbot 이 /etc 쪽을 직접
# 수정하면 다음 배포에서 TLS 설정이 사라진다.
# TLS 설정의 단일 출처는 이 파일이다.
#
# -----------------------------------------------------------------------------
# 공개 경로
#
#   /           React SPA (frontend/dist)
#   /api/       Django REST API (v1 세션 계약)
#   /static/    Django admin 정적 파일 (SSH 터널 접근 시 사용)
#
# /admin/ 은 프록시하지 않는다 (명세서 FR-50 조회 전용 보안 경계).
#   필요할 때만 SSH 터널로 접근한다.
#     ssh -i <pem> -L 8000:127.0.0.1:8000 ubuntu@i15c103.p.ssafy.io
#     브라우저에서 http://localhost:8000/admin/
#   /admin/ 요청은 아래 SPA fallback 으로 흘러가 index.html 이 반환된다.
#
# /media/ 도 노출하지 않는다. 세션 파일은
#   /api/v1/sessions/{id}/download/{kind} 가 직접 스트리밍한다.
#   저장된 SHA-256 과 실제 파일이 일치하는 READY 만 제공해야 하므로 (NFR-25)
#   Nginx 가 데이터 디렉터리를 바로 읽어 내보내지 않는다.
# -----------------------------------------------------------------------------

server {
    # nginx 1.25.1 이상이면 아래 두 줄을 권장한다.
    #     listen 443 ssl;
    #     http2 on;
    # 현재 서버는 nginx 1.24 이므로 통합 형식을 사용한다.
    listen 443 ssl http2;
    server_name i15c103.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/p.ssafy.io/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS. includeSubDomains 는 넣지 않는다.
    # p.ssafy.io 는 여러 팀이 공유하는 도메인이라 형제 서브도메인까지
    # HTTPS 를 강제하면 다른 팀 사이트 접속을 막을 수 있다.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # React 빌드 결과물 (frontend/dist) - "npm run build" 로 생성
    root /home/ubuntu/ec2_server/thing_database_web/frontend/dist;
    index index.html;

    # 업로드 본문 크기 상한
    # 명세서 6.5절: 세 파일 합계 80.25MiB, Django 85MiB, Nginx 90MiB
    client_max_body_size 90M;
    client_body_timeout 300s;

    # 1) API 요청 -> gunicorn(127.0.0.1:8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Django 의 SECURE_PROXY_SSL_HEADER 와 짝을 이룬다.
        # 이 헤더가 없으면 SECURE_SSL_REDIRECT 가 무한 리다이렉트를 만든다.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # 업로드 본문을 디스크에 전부 버퍼링하지 않고 그대로 스트리밍한다.
        proxy_request_buffering off;
    }

    # 2) 상태 확인 (명세서 FR-52)
    #    exact match 로 등록해 SPA fallback 보다 우선한다.
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        access_log off;
    }

    # 3) Django admin 정적 파일 (collectstatic 산출물)
    location /static/ {
        alias /home/ubuntu/ec2_server/thing_database_web/backend/staticfiles/;
    }

    # 4) 나머지는 React SPA (react-router BrowserRouter 대응)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
