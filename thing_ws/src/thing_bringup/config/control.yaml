command_manager:
  ros__parameters:
    initial_mode: 0
    owner_timeout_ms: 500
    reject_commands_while_sequence_running: true

command_guard:
  ros__parameters:
    command_timeout_ms: 300
    min_command_timeout_ms: 200
    max_command_timeout_ms: 500
    max_axis_delta_per_second: 1.5
    default_speed_limit: 0.25

safety_manager:
  ros__parameters:
    hold_duration_ms: 500
    require_manual_resume: true
    safe_pose:
      thumb_flex: 0.0
      thumb_opp: 0.0
      thumb_abd: 0.0
      index_flex: 0.0
      middle_flex: 0.0
      ring_flex: 0.0
      little_flex: 0.0
