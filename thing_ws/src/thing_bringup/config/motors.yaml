motor_driver_node:
  ros__parameters:
    # Seven motors are monitored; only calibrated fingers are controlled.
    integration_test_mode: true

    # Common DYNAMIXEL communication and operating mode
    model: "XL330-M288-T"
    baud_rate: 57600
    protocol_version: 2.0
    operating_mode: 5
    encoder_resolution_raw: 4096

    # ROS control and monitoring periods
    read_rate_hz: 20.0
    write_rate_hz: 50.0
    safe_velocity_limit: 0.5
    diagnostic_rate_hz: 1.0
    hardware_command_watchdog_ms: 500

    # Physical buses
    bus_names: ["BUS_A", "BUS_B", "BUS_C"]
    bus_devices:
      - "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTBIN51S-if00-port0"
      - "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTBIHT0L-if00-port0"
      - "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTBIHTHG-if00-port0"

    # Axis parameters are parallel arrays sorted by motor ID.
    # bus_indices refers to the zero-based index of bus_names/bus_devices.
    motor_ids: [1, 2, 3, 4, 5, 6, 7]
    controlled_motor_ids: [1, 3, 4, 7]
    actuator_names:
      - "ring_flex"
      - "thumb_flex"
      - "middle_flex"
      - "index_flex"
      - "thumb_abduction"
      - "thumb_opposition"
      - "little_flex"
    bus_indices: [0, 0, 0, 1, 1, 1, 2]

    # Measured endpoints on the assembled hand
    # Uncalibrated thumb endpoints use -1 and are never written while disabled.
    home_positions_raw: [110, -1, 750, 1740, -1, -1, 700]
    closed_positions_raw: [2700, -1, 3050, 4300, -1, -1, 3800]
    safe_positions_raw: [110, -1, 750, 1740, -1, -1, 700]
    position_tolerances_raw: [30, -1, 30, 30, -1, -1, 30]

    # Validated per-axis controller settings
    position_p_gains: [1200, 0, 500, 1000, 0, 0, 1200]
    position_i_gains: [20, 0, 30, 40, 0, 0, 20]
    position_d_gains: [600, 0, 600, 600, 0, 0, 600]
    goal_currents_ma: [500, 0, 500, 500, 0, 0, 500]
    profile_accelerations_raw: [50, 0, 50, 50, 0, 0, 50]
    profile_velocities_raw: [200, 0, 200, 200, 0, 0, 200]

    # Hardware limits and communication fault thresholds
    current_limit_ma: 1470
    max_consecutive_read_failures: 3
    bus_failure_timeout_ms: 300

    # temperature_warning_c, temperature_trip_c, fault_current_ma,
    # fault_current_hold_ms, and bus_watchdog_ms remain intentionally omitted
    # until monitored load tests establish safe values.
