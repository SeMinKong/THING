camera_node:
  ros__parameters:
    device_id: 0
    image_width: 640
    image_height: 480
    fps: 30.0
    frame_id: camera_color_optical_frame

mediapipe_node:
  ros__parameters:
    max_num_hands: 1
    model_complexity: 0
    min_detection_confidence: 0.6
    min_tracking_confidence: 0.6
    inference_width: 320
    inference_height: 240
    input_is_mirrored: false
    input_timeout_ms: 1000
    diagnostics_rate_hz: 1.0

hand_target_node:
  ros__parameters:
    publish_rate_hz: 20.0
    publish_without_control_state: true
    deadband: 0.02
    low_pass_alpha: 0.25
    max_axis_delta_per_frame: 0.08
    hand_confidence_min: 0.70
    hand_loss_debounce_ms: 250
    hand_reacquire_stable_ms: 300
    speed_limit: 1.0
    diagnostics_rate_hz: 1.0
    # User calibration measured from the world-landmark pipeline. Thumb flex
    # and opposition increase toward their maximum poses. Raw thumb abduction
    # also increases from attached to spread, so it publishes attached=0 and
    # fully spread=1.
    # 2026-08-06 user calibration.  The limits are placed slightly inside
    # the measured stable endpoints so relaxed/maximum poses reliably clamp
    # to 0/1 despite landmark jitter.
    thumb_flex_min: 0.1100
    thumb_flex_max: 0.1750
    thumb_opp_min: 0.0300
    thumb_opp_max: 0.4600
    # ABD now uses the palm-plane-projected CMC-to-tip direction. Keep its
    # first run uncalibrated; replace these with new attached/spread samples.
    thumb_abd_min: 0.0000
    thumb_abd_max: 1.0000
    index_flex_open: 0.174
    index_flex_closed: 0.711

    middle_flex_open: 0.205
    middle_flex_closed: 0.751

    ring_flex_open: 0.187
    ring_flex_closed: 0.679

    little_flex_open: 0.216
    little_flex_closed: 0.706

mjpeg_streamer:
  ros__parameters:
    http_host: 0.0.0.0
    http_port: 8080
    stream_path: /stream.mjpg
    target_fps: 15.0
    jpeg_quality: 60
    sync_cache_size: 10
    diagnostics_rate_hz: 1.0

web_bridge_node:
  ros__parameters:
    bind_address: 0.0.0.0
    port: 18000
    snapshot_period_ms: 200
    service_timeout_ms: 2000
