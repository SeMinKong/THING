camera_node:
  ros__parameters:
    device_id: 0
    image_width: 640
    image_height: 480
    fps: 30.0
    frame_id: camera_color_optical_frame

mediapipe_node:
  ros__parameters:
    max_num_hands: 1
    model_complexity: 0
    min_detection_confidence: 0.6
    min_tracking_confidence: 0.6
    inference_width: 320
    inference_height: 240
    input_is_mirrored: false
    input_timeout_ms: 1000
    diagnostics_rate_hz: 1.0

hand_target_node:
  ros__parameters:
    publish_rate_hz: 20.0
    deadband: 0.02
    low_pass_alpha: 0.25
    max_axis_delta_per_frame: 0.08
    hand_confidence_min: 0.70
    hand_loss_debounce_ms: 150
    hand_reacquire_stable_ms: 300
    speed_limit: 0.25
    diagnostics_rate_hz: 1.0

mjpeg_streamer:
  ros__parameters:
    http_host: 0.0.0.0
    http_port: 8080
    stream_path: /stream.mjpg
    target_fps: 15.0
    jpeg_quality: 60
    sync_cache_size: 10
    diagnostics_rate_hz: 1.0

web_bridge_node:
  ros__parameters:
    bind_address: 0.0.0.0
    port: 8000
    snapshot_period_ms: 200
    service_timeout_ms: 2000
