stages:
  - validate
  - build
  - test

default:
  image: ros:humble-ros-base
  before_script:
    - apt-get update
    - apt-get install -y python3-colcon-common-extensions python3-rosdep
    - rosdep update
    - rosdep install --from-paths thing_ws/src --ignore-src -r -y
    - source /opt/ros/humble/setup.bash

validate:repository:
  stage: validate
  script:
    - test -f "docs/requirements/요구사항 명세서 V5.md"
    - test -f thing_ws/src/thing_interfaces/CMakeLists.txt
    - test "$(find thing_ws/src/thing_interfaces/msg -name '*.msg' | wc -l)" -eq 7
    - '! grep -R "TODO: Package description\\|TODO: License declaration" thing_ws/src'

build:ros2:
  stage: build
  script:
    - cd thing_ws
    - colcon build --event-handlers console_direct+
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - thing_ws/log/

test:ros2:
  stage: test
  script:
    - cd thing_ws
    - colcon build
    - source install/setup.bash
    - colcon test --event-handlers console_direct+
    - colcon test-result --verbose
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - thing_ws/log/
